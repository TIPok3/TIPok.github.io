<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>КиберЩит — защити себя</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 10 L90 25 L90 55 Q90 85 60 110 Q30 85 30 55 L30 25 Z' fill='%2300FF94' stroke='%230B1E33' stroke-width='3'/%3E%3Ccircle cx='48' cy='48' r='5' fill='%230B1E33'/%3E%3Ccircle cx='72' cy='48' r='5' fill='%230B1E33'/%3E%3Cpath d='M45 62 Q60 72 75 62' stroke='%230B1E33' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0B1E33; overflow-x: hidden; }
    .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
    .bubble { position: absolute; background: rgba(0, 255, 148, 0.15); border-radius: 50%; filter: blur(40px); animation: floatBubble 20s infinite ease-in-out; }
    @keyframes floatBubble { 0% { transform: translate(0, 0) scale(1); opacity: 0.3; } 25% { transform: translate(5%, 5%) scale(1.1); opacity: 0.4; } 50% { transform: translate(10%, -5%) scale(0.9); opacity: 0.2; } 75% { transform: translate(-5%, 10%) scale(1.2); opacity: 0.4; } 100% { transform: translate(0, 0) scale(1); opacity: 0.3; } }
    .floating-dots { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
    .dot { position: absolute; width: 4px; height: 4px; background: rgba(0, 255, 148, 0.3); border-radius: 50%; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
    .mascot-glow { animation: glow 3s infinite alternate; }
    @keyframes glow { from { filter: drop-shadow(0 0 5px #00FF94); } to { filter: drop-shadow(0 0 20px #00FF94); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wink { 0%, 80%, 100% { transform: scaleY(1); } 85% { transform: scaleY(0.1); } }
    @keyframes pointWave { 0%, 100% { transform: rotate(0deg) translateX(0); } 50% { transform: rotate(3deg) translateX(2px); } }
    .mascot-container { animation: float 4s ease-in-out infinite; }
    .mascot-eye-left { animation: wink 6s infinite; transform-origin: center; transform-box: fill-box; }
    .mascot-antenna { animation: antennaWave 3s ease-in-out infinite; transform-origin: 60px 10px; }
    @keyframes antennaWave { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .pointing-finger { animation: pointWave 2.5s infinite ease-in-out; transform-origin: 90px 40px; }
    @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }
    .topic-figure { animation: wiggle 3s infinite ease-in-out; }
    .speech-bubble.game-bubble { position: absolute; background: #00FF94; border-radius: 20px; padding: 12px 18px; color: #0B1E33; font-weight: 500; max-width: 280px; width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.3); white-space: normal; }
    .speech-bubble.game-bubble:after { content: ''; position: absolute; left: -10px; bottom: 20px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 10px solid #00FF94; }
    .topic-card { background: linear-gradient(145deg, rgba(0,255,148,0.15) 0%, rgba(45,126,231,0.15) 100%); border: 2px solid rgba(255,255,255,0.15); border-radius: 2.5rem; transition: all 0.3s; backdrop-filter: blur(8px); width: 100%; max-width: 350px; padding: 2rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5); }
    .topic-card:hover { border-color: #00FF94; box-shadow: 0 0 30px rgba(0,255,148,0.4), 0 20px 30px -10px rgba(0,0,0,0.5); transform: translateY(-8px); }
    .topic-card:hover .topic-figure { animation: wiggle 1s infinite; }
    .topic-button { background: linear-gradient(135deg, #00FF94, #2D7EE7); color: #0B1E33; font-weight: 700; font-size: 1.5rem; padding: 0.75rem 2rem; border-radius: 60px; border: none; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 290px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .topic-button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,255,148,0.6); background: white; color: #0B1E33; }
    .topic-card:hover .bulb-filament { stroke: #FFD700; }
    .topic-card:hover .bulb-glow { opacity: 1; transform: scale(1.2); }
    #app { height: 100vh; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #00FF94 #0B1E33; position: relative; z-index: 1; width: 100%; }
    #app::-webkit-scrollbar { width: 6px; }
    #app::-webkit-scrollbar-track { background: #0B1E33; }
    #app::-webkit-scrollbar-thumb { background-color: #00FF94; border-radius: 20px; }
    @media (max-width: 768px) { .px-4 { padding-left: 1rem; padding-right: 1rem; } .topic-card { max-width: 300px; } }
    .speech-bubble { position: relative; background: #00FF94; border-radius: 20px; padding: 12px 18px; color: #0B1E33; font-weight: 500; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .speech-bubble:after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 12px solid #00FF94; }

    #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.6; }
    .relative { z-index: 2; }

    /* Телефон */
    .phone-frame {
      background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
      border-radius: 3rem;
      padding: 1rem 0.8rem 0.8rem 0.8rem;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.1);
      width: 380px;
      margin: 0 auto;
      position: relative;
    }
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 28px;
      background: #0B1E33;
      border-radius: 20px;
      z-index: 10;
    }
    .phone-screen {
      background: #0B1E33;
      border-radius: 2.5rem;
      overflow: hidden;
      height: 600px;
      position: relative;
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 25px;
      background: #0a0a1a;
      border-radius: 0 0 20px 20px;
      z-index: 20;
    }
    .phone-content {
      padding: 60px 20px 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .phone-home {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: #4a4a6a;
      border-radius: 2px;
    }
    .card-enter { animation: cardFadeIn 0.4s ease-out; }
    @keyframes cardFadeIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    /* Компьютер */
    .computer-monitor {
      background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
      border-radius: 1.5rem 1.5rem 0.5rem 0.5rem;
      padding: 1rem;
      box-shadow: 0 0 0 4px #2D7EE7, 0 20px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      width: 800px;
      margin: 0 auto;
    }
    .computer-screen {
      background: #0B1E33;
      border-radius: 1rem;
      overflow: hidden;
      height: 520px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .computer-content {
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .computer-window {
      background: linear-gradient(145deg, #1a3150, #0B1E33);
      border: none;
      outline: 2px solid #2D7EE7;
      outline-offset: -2px;
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .window-bar {
      background: rgba(0,255,148,0.2);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #00FF94;
    }
    .window-dots { display: flex; gap: 8px; }
    .dot-red { width: 12px; height: 12px; background: #ff5f56; border-radius: 50%; }
    .dot-yellow { width: 12px; height: 12px; background: #ffbd2e; border-radius: 50%; }
    .dot-green { width: 12px; height: 12px; background: #27c93f; border-radius: 50%; }
    .window-title { color: white; font-weight: 600; font-size: 14px; }
    .window-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .computer-stand {
      width: 100px;
      height: 20px;
      background: #2D7EE7;
      margin: 0 auto;
      border-radius: 0 0 10px 10px;
    }
    .computer-base {
      width: 180px;
      height: 8px;
      background: #1a1a2e;
      margin: 5px auto 0;
      border-radius: 4px;
    }

    /* Интернет */
    .internet-scene {
      position: relative;
      width: 100%;
      height: calc(100vh - 5rem);
      overflow: hidden;
    }
    .internet-canvas-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      perspective: 1000px;
      perspective-origin: 50% 50%;
    }
    .internet-camera {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }
    .internet-node {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .node-sphere {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00FF94, #2D7EE7);
      box-shadow: 0 0 20px currentColor;
      position: absolute;
      left: -10px;
      top: -10px;
      transition: transform 0.3s, box-shadow 0.3s;
      pointer-events: auto;
      cursor: pointer;
    }
    .internet-node.active .node-sphere {
      transform: scale(1.3);
      box-shadow: 0 0 30px #00FF94;
    }
    .internet-lines-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform-style: preserve-3d;
    }
    .internet-card-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 540px;
      z-index: 50;
      pointer-events: none;
    }
    .internet-card {
      background: linear-gradient(145deg, #1a3150, #0B1E33);
      border: 2px solid #00FF94;
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px #00FF9440;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .nav-arrow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00FF94, #2D7EE7);
      color: #0B1E33;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      pointer-events: auto;
      z-index: 100;
    }
    .nav-arrow:hover { transform: scale(1.1); box-shadow: 0 0 20px #00FF94; }
    .nav-arrow.disabled { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="networkCanvas"></canvas>
  <div class="bubbles"><div class="bubble" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-duration: 18s;"></div><div class="bubble" style="width: 400px; height: 400px; bottom: 20%; right: 10%; animation-duration: 22s; background: rgba(45, 126, 231, 0.1);"></div><div class="bubble" style="width: 250px; height: 250px; top: 50%; left: 20%; animation-duration: 15s;"></div><div class="bubble" style="width: 350px; height: 350px; bottom: 10%; left: 30%; animation-duration: 25s; background: rgba(0, 255, 148, 0.1);"></div><div class="bubble" style="width: 200px; height: 200px; top: 80%; right: 25%; animation-duration: 20s;"></div></div>
  <div class="floating-dots"></div>
  <div id="app" class="flex flex-col h-screen w-full relative">
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#0B1E33]/95 backdrop-blur-md border-b border-white/10">
      <div class="w-full px-4 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex items-center gap-3 group cursor-pointer" id="logo"><div class="relative"><i data-lucide="shield" class="w-10 h-10 text-[#00FF94] group-hover:scale-110 transition-transform"></i><div class="absolute inset-0 bg-[#00FF94]/20 blur-xl group-hover:bg-[#00FF94]/40 transition-all"></div></div><span class="text-2xl font-bold bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] bg-clip-text text-transparent">КиберЩит</span></div>
          <div class="hidden lg:flex items-center gap-1"><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="phone" onclick="startLearning('phone')">Телефон</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="internet" onclick="startLearning('internet')">Интернет</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="computer" onclick="startLearning('computer')">Компьютер</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="quiz" onclick="navigateTo('quiz')">Квиз</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="game" onclick="navigateTo('game')">Найди мошенника</button></div>
          <button class="lg:hidden p-2 text-white hover:bg-white/10 rounded-lg transition-colors" id="mobileMenuBtn"><i data-lucide="menu" size="24"></i></button>
        </div>
        <div id="mobileNav" class="lg:hidden hidden py-4 space-y-2"><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="phone" onclick="startLearning('phone')">Телефон</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="internet" onclick="startLearning('internet')">Интернет</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="computer" onclick="startLearning('computer')">Компьютер</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="quiz" onclick="navigateTo('quiz')">Квиз</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="game" onclick="navigateTo('game')">Найди мошенника</button></div>
      </div>
    </header>
    <main id="screenContent" class="flex-1 flex flex-col items-center justify-start w-full pt-24 relative z-10"></main>
  </div>
  <script>
    lucide.createIcons();

    // Фоновая сеть
    const canvas = document.getElementById('networkCanvas');
    let ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let points = [];
    let stepTransition = 0;
    function initPoints() { const count = Math.floor((width * height) / 8000); points = []; for (let i = 0; i < count; i++) points.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, radius: 1 + Math.random() * 2, phase: Math.random() * Math.PI * 2 }); }
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; initPoints(); }
    function drawNetwork(transition = 0) { if (!ctx) return; ctx.clearRect(0, 0, width, height); ctx.fillStyle = '#0B1E33'; ctx.fillRect(0, 0, width, height); const maxDist = 150; for (let i = 0; i < points.length; i++) { for (let j = i+1; j < points.length; j++) { const dx = points[i].x - points[j].x, dy = points[i].y - points[j].y, dist = Math.hypot(dx, dy); if (dist < maxDist) { const opacity = (1 - dist/maxDist) * 0.3 * (0.8 + transition * 0.4); ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y); ctx.lineTo(points[j].x, points[j].y); ctx.strokeStyle = `rgba(0, 255, 148, ${opacity})`; ctx.lineWidth = 0.8; ctx.stroke(); } } } for (const p of points) { const glow = 2 + Math.sin(Date.now() * 0.002 + p.phase) * 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + transition * 0.5, 0, Math.PI*2); ctx.fillStyle = `rgba(0, 255, 148, 0.8)`; ctx.fill(); ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + glow * 0.3, 0, Math.PI*2); ctx.fillStyle = `rgba(0, 255, 148, 0.3)`; ctx.fill(); } }
    function updatePoints() { for (const p of points) { p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = width; if (p.x > width) p.x = 0; if (p.y < 0) p.y = height; if (p.y > height) p.y = 0; } }
    function animate() { if (!canvas.isConnected) return; updatePoints(); if (stepTransition > 0) stepTransition -= 0.02; else stepTransition = 0; drawNetwork(stepTransition); requestAnimationFrame(animate); }
    function triggerNetworkTransition() { stepTransition = 0.8; for (const p of points) { p.vx += (Math.random() - 0.5) * 0.5; p.vy += (Math.random() - 0.5) * 0.5; } }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animate();

    // Состояние
    let currentScreen = 'home';
    let currentTopic = 'phone';
    let learningStep = 0;
    let phoneSteps = [], internetSteps = [], computerSteps = [];
    let quizState = { currentQuestion: 0, selectedAnswer: null, showExplanation: false, score: 0, questions: [] };
    let gameState = { currentMessage: 0, selectedAnswer: null, showResult: false, score: 0, messages: [] };
    let internetNodesPositions = [];
    let internetConnections = [];

    async function loadData() {
      try {
        const response = await fetch('data.json');
        const data = await response.json();
        phoneSteps = data.phoneSteps;
        internetSteps = data.internetSteps;
        computerSteps = data.computerSteps;
        quizState.questions = data.quizQuestions;
        gameState.messages = data.gameMessages;
        renderScreen();
      } catch(e) { console.error('Ошибка загрузки данных:', e); }
    }

    function getMascotSVG(variant = 'happy', className = 'w-20 h-20') {
      let mouthPath, pointingFinger = '';
      if (variant === 'thinking') mouthPath = '<path d="M45 65 Q60 68 75 65" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else if (variant === 'happy') mouthPath = '<path d="M45 62 Q60 72 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else if (variant === 'winking') mouthPath = '<path d="M45 62 Q60 70 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else mouthPath = '<path d="M45 62 Q60 72 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      let leftEye, rightEye;
      if (variant === 'winking') { leftEye = '<circle cx="48" cy="48" r="1" fill="#0B1E33"/>'; rightEye = '<circle cx="72" cy="48" r="5" fill="#0B1E33"/>'; }
      else { leftEye = '<circle cx="48" cy="48" r="5" fill="#0B1E33" class="mascot-eye-left"/>'; rightEye = '<circle cx="72" cy="48" r="5" fill="#0B1E33"/>'; }
      if (variant === 'pointing') pointingFinger = '<path class="pointing-finger" d="M85 45 L100 35 L105 38 L90 48 Z" fill="#00FF94" stroke="#0B1E33" stroke-width="2"/>';
      return '<svg width="120" height="120" viewBox="-5 -5 130 130" class="mascot-container mascot-glow ' + className + '"><path d="M60 10 L90 25 L90 55 Q90 85 60 110 Q30 85 30 55 L30 25 Z" fill="#00FF94" stroke="#0B1E33" stroke-width="3"/><path d="M60 20 L80 30 L80 52 Q80 75 60 95 Q40 75 40 52 L40 30 Z" fill="#0B1E33" opacity="0.3"/>' + leftEye + rightEye + mouthPath + '<g transform="translate(60,70)"><rect x="-8" y="-3" width="16" height="12" rx="2" fill="#2D7EE7" /><path d="M -5 -3 L -5 -8 Q -5 -12 0 -12 Q 5 -12 5 -8 L 5 -3" fill="none" stroke="#2D7EE7" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="2" r="2" fill="#0B1E33" /></g>' + pointingFinger + '<g class="mascot-antenna"><line x1="50" y1="10" x2="50" y2="2" stroke="#2D7EE7" stroke-width="2" /><circle cx="50" cy="2" r="3" fill="#2D7EE7" /><line x1="70" y1="10" x2="70" y2="2" stroke="#2D7EE7" stroke-width="2" /><circle cx="70" cy="2" r="3" fill="#2D7EE7" /></g></svg>';
    }

    let currentSpeakingStepId = null;
    function speakText(text) { if (!window.speechSynthesis) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.rate=0.9; u.onend=()=>currentSpeakingStepId=null; window.speechSynthesis.speak(u); }
    function stopSpeech() { if(window.speechSynthesis) window.speechSynthesis.cancel(); }

    // Рендеры (без изменений, кроме Интернета)
    function renderHome() {

    function convertTableToList(html) {
      if (!html.includes('<table')) return html;
      const tableMatch = html.match(/<table[\s\S]*?<\/table>/i);
      if (!tableMatch) return html;
      const tableHtml = tableMatch[0];
      const rows = [];
      const rowMatches = tableHtml.match(/<tr[\s\S]*?<\/tr>/gi);
      if (rowMatches) {
        for (let i = 1; i < rowMatches.length; i++) {
          const cells = rowMatches[i].match(/<td[\s\S]*?<\/td>/gi);
          if (cells && cells.length >= 4) {
            const method = cells[0].replace(/<\/?td>/gi, '').trim();
            const pros = cells[1].replace(/<\/?td>/gi, '').trim();
            const cons = cells[2].replace(/<\/?td>/gi, '').trim();
            const rating = cells[3].replace(/<\/?td>/gi, '').trim();
            rows.push(`<div class="flex flex-col gap-1 bg-white/5 rounded-lg p-2 border border-white/10 mb-2"><div class="flex justify-between items-center"><span class="font-bold text-white">${method}</span><span class="text-[#00FF94] text-xs">${rating}</span></div><div class="text-white/80 text-xs">✅ ${pros}</div><div class="text-white/80 text-xs">❌ ${cons}</div></div>`);
          }
        }
      }
      return rows.length ? html.replace(tableHtml, `<div class="space-y-2">${rows.join('')}</div>`) : html;
    }

    // ========== ИНТЕРНЕТ (ПОЛНОСТЬЮ ПЕРЕСОБРАН) ==========
    function renderInternet() {
      const steps = internetSteps;
      const count = steps.length;
      
      // Хаотичные позиции в кольце
      const positions = [];
      const baseRadius = 300;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
        const randomOffset = 0.8 + Math.random() * 0.5;
        const x = Math.cos(angle) * baseRadius * randomOffset;
        const y = Math.sin(angle) * baseRadius * 0.7 * randomOffset;
        const z = -40 + Math.sin(angle * 2.5) * 100 + (Math.random() - 0.5) * 50;
        positions.push({ x, y, z });
      }
      internetNodesPositions = positions;

      // Соединения (сеть)
      const connections = [];
      for (let i = 0; i < count; i++) {
        connections.push({ from: i, to: (i+1) % count });
        connections.push({ from: i, to: (i+2) % count });
        if (i % 3 === 0) connections.push({ from: i, to: (i+count-1) % count });
      }
      internetConnections = connections;

      const currentPos = positions[learningStep];
      const cameraTransform = `translate3d(${-currentPos.x}px, ${-currentPos.y}px, ${-currentPos.z + 500}px)`;

      const step = steps[learningStep];

      return `
        <div class="internet-scene">
          <!-- Верхний бар -->
          <div class="absolute top-2 left-1/2 -translate-x-1/2 w-auto px-4 z-40 pointer-events-none" style="width: 90%; max-width: 600px;">
            <div class="flex justify-between items-center text-white/60 text-sm mb-1">
              <button class="hover:text-[#00FF94] transition-colors flex items-center gap-1 pointer-events-auto" onclick="goBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i> Назад</button>
              <span class="text-base">Шаг ${learningStep+1} из ${steps.length}</span>
              <div class="w-10"></div>
            </div>
            <div class="w-full bg-[#1a3150] rounded-full h-1.5">
              <div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-1.5 rounded-full transition-all duration-500" style="width: ${((learningStep+1)/steps.length)*100}%;"></div>
            </div>
          </div>

          <!-- 3D сцена -->
          <div class="internet-canvas-3d">
            <div class="internet-camera" id="internetCamera" style="transform: ${cameraTransform};">
              <!-- Фоновые сетки -->
              <div class="absolute inset-0" style="transform-style: preserve-3d;">
                ${[-600,-300,0,300,600].map(z => `
                  <div class="absolute" style="width:2000px; height:1px; left:-1000px; top:50%; background:linear-gradient(90deg, transparent, rgba(0,255,148,0.08), transparent); transform: translate3d(0,0,${z}px);"></div>
                  <div class="absolute" style="width:1px; height:2000px; left:50%; top:-1000px; background:linear-gradient(180deg, transparent, rgba(45,126,231,0.08), transparent); transform: translate3d(0,0,${z}px);"></div>
                `).join('')}
              </div>

              <!-- ЛИНИИ СЕТИ (созданы заново в том же 3D-пространстве) -->
              <svg class="internet-lines-svg" style="transform: translateZ(-30px);">
                <defs>
                  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00FF94" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#2D7EE7" stop-opacity="0.8"/>
                  </linearGradient>
                  <filter id="glow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                ${internetConnections.map(c => {
                  const from = positions[c.from];
                  const to = positions[c.to];
                  const isActive = (c.from === learningStep || c.to === learningStep);
                  return `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="url(#lineGrad)" stroke-width="${isActive ? 3 : 1.5}" stroke-dasharray="${c.layer === 'back' ? '5,8' : 'none'}" opacity="${isActive ? 0.9 : 0.4}" filter="url(#glow)" class="connection-line" data-from="${c.from}" data-to="${c.to}" style="transition: all 0.5s;"/>`;
                }).join('')}
              </svg>

              <!-- Узлы -->
              ${positions.map((pos, idx) => `
                <div class="internet-node ${idx === learningStep ? 'active' : ''}" style="transform: translate3d(${pos.x}px, ${pos.y}px, ${pos.z}px);">
                  <div class="node-sphere" style="color: ${idx === learningStep ? '#00FF94' : '#2D7EE7'};" onclick="setInternetStep(${idx})"></div>
                </div>
              `).join('')}

              <!-- Частицы -->
              ${[...Array(15)].map(() => {
                const x = (Math.random() - 0.5) * 800;
                const y = (Math.random() - 0.5) * 600;
                const z = (Math.random() - 0.5) * 400;
                return `<div class="absolute w-1 h-1 rounded-full bg-[#00FF94] animate-pulse" style="left:50%; top:50%; transform: translate3d(${x}px, ${y}px, ${z}px); opacity:0.5;"></div>`;
              }).join('')}
            </div>
          </div>

          <!-- Карточка (чуть шире) -->
          <div class="internet-card-overlay" style="max-width: 580px;">
            <div class="internet-card">
              <div class="flex items-center gap-3 mb-3">
                <div class="p-2.5 bg-gradient-to-br from-[#00FF94]/20 to-[#2D7EE7]/20 rounded-xl border border-[#00FF94]/30">
                  <i data-lucide="${step.icon}" class="w-6 h-6 text-[#00FF94]"></i>
                </div>
                <div class="flex-1">
                  <div class="text-xl mb-0.5">🌐</div>
                  <h3 class="text-white font-bold text-lg">${step.title}</h3>
                </div>
              </div>
              <div class="bg-gradient-to-br from-[#00FF94]/10 to-[#2D7EE7]/10 rounded-xl p-3 mb-3 border border-[#00FF94]/30">
                <p class="text-white font-semibold text-center">${step.content.split('•')[0].trim()}</p>
              </div>
              <div class="space-y-2 mb-3">
                ${step.content.split('<br>').filter(p => p.includes('•')).slice(0,4).map(p => `
                  <div class="flex items-start gap-2 bg-white/5 rounded-lg p-2.5 border border-white/10">
                    <i data-lucide="shield" class="w-4 h-4 text-[#00FF94] mt-0.5"></i>
                    <span class="text-white/90 text-sm">${p.replace('•','').trim()}</span>
                  </div>
                `).join('')}
              </div>
              <div class="bg-[#0B1E33] rounded-xl p-2.5 flex items-center gap-2 border border-[#00FF94]/30">
                ${getMascotSVG('winking', 'w-8 h-8 flex-shrink-0')}
                <p class="text-sm text-[#00FF94]">💡 ${step.title.includes('VPN')?'Бесплатные VPN продают данные':step.title.includes('Коды')?'Никому не сообщайте код':'Всегда проверяйте ссылки'}</p>
              </div>
            </div>
          </div>

          <!-- СТРЕЛКИ (новые, с высоким z-index) -->
          <div class="absolute top-1/2 -translate-y-1/2 left-0 right-0 flex justify-between px-2 sm:px-4 z-50 pointer-events-none" style="max-width: 700px; margin: 0 auto;">
            <div class="nav-arrow ${learningStep === 0 ? 'disabled' : ''}" onclick="window.prevStep()" style="pointer-events: auto;"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <div class="nav-arrow ${learningStep === steps.length-1 ? 'disabled' : ''}" onclick="window.nextStep()" style="pointer-events: auto;"><i data-lucide="chevron-right" class="w-6 h-6"></i></div>
          </div>

          <!-- Индикатор точек -->
          <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-40">
            ${steps.map((_, idx) => `<button class="h-2 rounded-full transition-all ${idx === learningStep ? 'w-8 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7]' : 'w-2 bg-white/30 hover:bg-white/50'}" onclick="setInternetStep(${idx})"></button>`).join('')}
          </div>
        </div>
      `;
    }

    window.setInternetStep = function(step) {
      if (step === learningStep) return;
      stopSpeech();
      learningStep = step;
      const camera = document.getElementById('internetCamera');
      if (camera) {
        const pos = internetNodesPositions[step];
        camera.style.transform = `translate3d(${-pos.x}px, ${-pos.y}px, ${-pos.z + 500}px)`;
        document.querySelectorAll('.internet-node').forEach((node, idx) => node.classList.toggle('active', idx === step));
        document.querySelectorAll('.connection-line').forEach(line => {
          const from = parseInt(line.dataset.from);
          const to = parseInt(line.dataset.to);
          const active = (from === step || to === step);
          line.style.opacity = active ? '0.9' : '0.4';
          line.setAttribute('stroke-width', active ? '3' : '1.5');
        });
        updateInternetCardContent(step);
        const stepSpan = document.querySelector('.internet-scene .text-white\\/60 span:last-child');
        if (stepSpan) stepSpan.textContent = `Шаг ${step+1} из ${internetSteps.length}`;
        const progressBar = document.querySelector('.internet-scene .bg-gradient-to-r');
        if (progressBar) progressBar.style.width = `${((step+1)/internetSteps.length)*100}%`;
        document.querySelectorAll('.internet-scene .flex.justify-center.gap-2 button').forEach((btn, idx) => {
          btn.className = `h-2 rounded-full transition-all ${idx === step ? 'w-8 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7]' : 'w-2 bg-white/30 hover:bg-white/50'}`;
        });
        const leftArrow = document.querySelector('.internet-scene .nav-arrow:first-child');
        const rightArrow = document.querySelector('.internet-scene .nav-arrow:last-child');
        if (leftArrow) leftArrow.classList.toggle('disabled', step === 0);
        if (rightArrow) rightArrow.classList.toggle('disabled', step === internetSteps.length-1);
        triggerNetworkTransition();
      } else {
        renderScreen();
      }
    };

    function updateInternetCardContent(stepIdx) {
      const step = internetSteps[stepIdx];
      const card = document.querySelector('.internet-card');
      if (!card) return;
      card.innerHTML = `
        <div class="flex items-center gap-3 mb-3">
          <div class="p-2.5 bg-gradient-to-br from-[#00FF94]/20 to-[#2D7EE7]/20 rounded-xl border border-[#00FF94]/30">
            <i data-lucide="${step.icon}" class="w-6 h-6 text-[#00FF94]"></i>
          </div>
          <div class="flex-1">
            <div class="text-xl mb-0.5">🌐</div>
            <h3 class="text-white font-bold text-lg">${step.title}</h3>
          </div>
        </div>
        <div class="bg-gradient-to-br from-[#00FF94]/10 to-[#2D7EE7]/10 rounded-xl p-3 mb-3 border border-[#00FF94]/30">
          <p class="text-white font-semibold text-center">${step.content.split('•')[0].trim()}</p>
        </div>
        <div class="space-y-2 mb-3">
          ${step.content.split('<br>').filter(p => p.includes('•')).slice(0,4).map(p => `
            <div class="flex items-start gap-2 bg-white/5 rounded-lg p-2.5 border border-white/10">
              <i data-lucide="shield" class="w-4 h-4 text-[#00FF94] mt-0.5"></i>
              <span class="text-white/90 text-sm">${p.replace('•','').trim()}</span>
            </div>
          `).join('')}
        </div>
        <div class="bg-[#0B1E33] rounded-xl p-2.5 flex items-center gap-2 border border-[#00FF94]/30">
          ${getMascotSVG('winking', 'w-8 h-8 flex-shrink-0')}
          <p class="text-sm text-[#00FF94]">💡 ${step.title.includes('VPN')?'Бесплатные VPN продают данные':step.title.includes('Коды')?'Никому не сообщайте код':'Всегда проверяйте ссылки'}</p>
        </div>
      `;
      lucide.createIcons();
    }

    function updateInternetCamera() {
      if (currentTopic !== 'internet') return;
      const camera = document.getElementById('internetCamera');
      if (!camera || !internetNodesPositions.length) return;
      const pos = internetNodesPositions[learningStep];
      camera.style.transform = `translate3d(${-pos.x}px, ${-pos.y}px, ${-pos.z + 500}px)`;
    }

    function renderLearning() {
      stopSpeech();
      if (currentTopic === 'phone') return renderPhone();
      if (currentTopic === 'computer') return renderComputer();
      return renderInternet();
    }

    function initSwipe() {
      if (currentTopic !== 'phone') return;
      const card = document.getElementById('swipeCard');
      if (!card) return;
      let startX = 0;
      card.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
      card.addEventListener('touchend', (e) => { if (!startX) return; const diff = e.changedTouches[0].clientX - startX; if (Math.abs(diff) > 50) diff > 0 ? prevStep() : nextStep(); startX = 0; });
      let mouseDown = false, mouseStartX = 0;
      card.addEventListener('mousedown', (e) => { mouseDown = true; mouseStartX = e.clientX; card.style.cursor = 'grabbing'; });
      window.addEventListener('mouseup', (e) => { if (!mouseDown) return; const diff = e.clientX - mouseStartX; if (Math.abs(diff) > 50) diff > 0 ? prevStep() : nextStep(); mouseDown = false; card.style.cursor = 'grab'; });
    }

    // Квиз и игра (без изменений)
    function renderQuiz() {
      const q = quizState.questions[quizState.currentQuestion];
      const progress = ((quizState.currentQuestion + 1) / quizState.questions.length) * 100;
      if (quizState.currentQuestion >= quizState.questions.length) return renderQuizResult();
      return `<div class="min-h-screen w-full pt-4 pb-12"><div class="w-full px-4 lg:px-8 max-w-4xl mx-auto"><div class="mb-4"><div class="flex justify-between items-center mb-2"><span class="text-white/60">Вопрос ${quizState.currentQuestion + 1} из ${quizState.questions.length}</span><span class="text-[#00FF94] font-semibold">Счёт: ${quizState.score}</span></div><div class="w-full bg-[#1a3150] rounded-full h-3"><div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-3 rounded-full" style="width: ${progress}%;"></div></div></div><div class="bg-[#1a3150] border border-white/10 rounded-3xl p-8 lg:p-12 mb-8"><div class="flex flex-col lg:flex-row gap-8 items-start"><div class="flex-1"><h2 class="text-2xl lg:text-3xl font-bold text-white mb-8">${q.question}</h2><div class="space-y-4">${q.options.map((opt, idx) => `<button class="quiz-option w-full p-4 rounded-xl text-left transition-all ${quizState.selectedAnswer === null ? 'bg-white/5 hover:bg-white/10 border-2 border-transparent hover:border-[#00FF94]/50 text-white' : idx === q.correct ? 'bg-[#00FF94]/20 border-2 border-[#00FF94] text-white' : idx === quizState.selectedAnswer ? 'bg-red-500/20 border-2 border-red-500 text-white' : 'bg-white/5 border-2 border-transparent text-white/50'}" onclick="selectQuizAnswer(${idx})" ${quizState.selectedAnswer !== null ? 'disabled' : ''}><div class="flex items-center gap-3">${quizState.selectedAnswer !== null ? (idx === q.correct ? '<i data-lucide="check-circle" class="text-[#00FF94] flex-shrink-0" size="24"></i>' : idx === quizState.selectedAnswer ? '<i data-lucide="x-circle" class="text-red-500 flex-shrink-0" size="24"></i>' : '') : ''}<span class="flex-1">${opt}</span></div></button>`).join('')}</div></div><div class="hidden lg:block lg:w-auto relative flex flex-col items-center mt-40">${quizState.showExplanation ? `<div class="speech-bubble absolute right-0 bottom-full mb-2 z-10" style="right: -200px; min-width: 250px;">${q.explanation}</div>` : ''}${getMascotSVG(quizState.showExplanation ? (quizState.selectedAnswer === q.correct ? 'happy' : 'thinking') : 'pointing', 'w-60 h-60')}</div></div></div>${quizState.showExplanation ? `<div class="flex justify-center"><button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl font-semibold text-lg hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all hover:scale-105" onclick="nextQuizQuestion()">${quizState.currentQuestion < quizState.questions.length - 1 ? 'Следующий вопрос' : 'Завершить'}</button></div>` : ''}<div class="lg:hidden mt-8 flex flex-col items-center">${quizState.showExplanation ? `<div class="speech-bubble mb-4" style="max-width: 90%;">${q.explanation}</div>${getMascotSVG(quizState.showExplanation ? (quizState.selectedAnswer === q.correct ? 'happy' : 'thinking') : 'pointing', 'w-48 h-48')}` : ''}</div></div></div>`;
    }
    function renderQuizResult() {
      const percent = (quizState.score / quizState.questions.length) * 100;
      return `<div class="min-h-screen w-full pt-4 pb-12"><div class="w-full px-4 lg:px-8 max-w-4xl mx-auto"><div class="flex flex-col items-center"><div class="w-full max-w-2xl"><div class="bg-[#1a3150] border border-white/10 rounded-3xl p-8 lg:p-12"><i data-lucide="trophy" class="w-20 h-20 text-[#00FF94] mx-auto mb-6"></i><h1 class="text-4xl lg:text-5xl font-bold text-white text-center mb-4">Квиз завершён!</h1><div class="text-6xl font-bold bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] bg-clip-text text-transparent text-center mb-4">${quizState.score} / ${quizState.questions.length}</div><p class="text-xl text-white/80 text-center mb-8">${percent === 100 ? 'Идеально! Ты настоящий киберэксперт! 🏆' : percent >= 80 ? 'Отлично! Ты хорошо разбираешься в безопасности! 🌟' : percent >= 60 ? 'Хорошо! Но есть куда расти! 💪' : percent >= 40 ? 'Неплохо! Рекомендую пройти материалы ещё раз 📚' : 'Нужно подучиться! Начни с главной страницы 🔄'}</p><div class="w-full bg-[#0B1E33] rounded-full h-4 mb-8"><div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-4 rounded-full" style="width: ${percent}%;"></div></div><div class="flex flex-col sm:flex-row gap-4 justify-center"><button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl font-semibold hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="restartQuiz()"><i data-lucide="rotate-ccw" size="20"></i>Пройти снова</button><button class="px-8 py-4 bg-white/10 backdrop-blur-sm text-white rounded-xl font-semibold border border-white/20 hover:bg-white/20 hover:border-[#00FF94]/50 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="goHome()"><i data-lucide="home" size="20"></i>На главную</button></div></div></div><div class="mt-8 flex justify-center">${getMascotSVG('happy', 'w-48 h-48 lg:w-64 lg:h-64')}</div></div></div></div>`;
    }
    function renderGame() {
      const msg = gameState.messages[gameState.currentMessage];
      if (gameState.currentMessage >= gameState.messages.length) return renderGameResult();
      let cardHighlightClass = '';
      if (gameState.showResult) {
        cardHighlightClass = gameState.selectedAnswer === msg.isScam ? 'border-[#00FF94] bg-[#00FF94]/10' : 'border-red-500 bg-red-500/10';
      } else {
        cardHighlightClass = 'border-white/20 bg-transparent';
      }
      return `<div class="min-h-screen w-full pt-4 pb-12"><div class="w-full px-4 lg:px-8 max-w-5xl mx-auto"><div class="mb-4"><div class="flex justify-between items-center mb-2"><span class="text-white/60">Сообщение ${gameState.currentMessage + 1} из ${gameState.messages.length}</span><span class="text-[#00FF94] font-semibold">Счёт: ${gameState.score}</span></div><div class="w-full bg-[#1a3150] rounded-full h-3"><div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-3 rounded-full" style="width: ${((gameState.currentMessage + 1) / gameState.messages.length) * 100}%;"></div></div></div><div class="flex justify-center"><div class="relative"><div class="max-w-md w-full transition-all duration-300"><div class="bg-[#1a3150] border-4 rounded-[2.5rem] p-4 shadow-2xl ${cardHighlightClass}"><div class="bg-[#0B1E33] rounded-t-3xl p-4 mb-2"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#00FF94] to-[#2D7EE7] flex items-center justify-center"><i data-lucide="smartphone" size="20" class="text-[#0B1E33]"></i></div><div class="flex-1"><div class="text-white font-semibold">${msg.from}</div>${msg.subject ? `<div class="text-white/60 text-sm">${msg.subject}</div>` : ''}<div class="text-white/40 text-xs">${msg.type === 'sms' ? 'SMS' : 'Email'}</div></div></div></div><div class="bg-white/5 rounded-2xl p-6 min-h-[250px]"><p class="text-white whitespace-pre-line leading-relaxed">${msg.message}</p></div></div>${!gameState.showResult ? `<div class="flex flex-col sm:flex-row gap-4 justify-center mt-8"><button class="px-8 py-4 bg-red-500/20 border-2 border-red-500 text-white rounded-xl font-semibold hover:bg-red-500/30 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="selectGameAnswer(true)"><i data-lucide="alert-triangle" size="20"></i>Это мошенники</button><button class="px-8 py-4 bg-[#00FF94]/20 border-2 border-[#00FF94] text-white rounded-xl font-semibold hover:bg-[#00FF94]/30 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="selectGameAnswer(false)"><i data-lucide="check-circle" size="20"></i>Всё нормально</button></div>` : ''}${gameState.showResult ? `<div class="flex justify-center mt-8"><button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl font-semibold text-lg hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all hover:scale-105" onclick="nextGameMessage()">${gameState.currentMessage < gameState.messages.length - 1 ? 'Следующее сообщение' : 'Завершить'}</button></div>` : ''}</div><div class="hidden lg:block absolute left-full top-1/2 transform -translate-y-1/2 ml-4">${gameState.showResult ? `<div class="speech-bubble game-bubble" style="top: -90px; left: 85%;">${msg.explanation}</div>` : ''}${getMascotSVG(gameState.showResult ? (gameState.selectedAnswer === msg.isScam ? 'happy' : 'thinking') : 'pointing', 'w-60 h-60')}</div></div></div><div class="lg:hidden mt-8 flex flex-col items-center">${gameState.showResult ? `<div class="speech-bubble mb-4" style="max-width: 90%;">${msg.explanation}</div>${getMascotSVG(gameState.showResult ? (gameState.selectedAnswer === msg.isScam ? 'happy' : 'thinking') : 'pointing', 'w-48 h-48')}` : ''}</div></div></div>`;
    }
    function renderGameResult() {
      const percent = (gameState.score / gameState.messages.length) * 100;
      return `<div class="min-h-screen w-full pt-4 pb-12"><div class="w-full px-4 lg:px-8 max-w-2xl mx-auto text-center">${getMascotSVG('happy', 'w-40 h-40 mx-auto mb-8')}<div class="bg-[#1a3150] border border-white/10 rounded-3xl p-8 lg:p-12 mb-8"><i data-lucide="alert-triangle" class="w-20 h-20 text-[#00FF94] mx-auto mb-6"></i><h1 class="text-4xl lg:text-5xl font-bold text-white mb-4">Детектив завершён!</h1><div class="text-6xl font-bold bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] bg-clip-text text-transparent mb-4">${gameState.score} / ${gameState.messages.length}</div><p class="text-xl text-white/80 mb-8">${percent === 100 ? 'Идеально! Ты — настоящий детектив мошенничества! 🕵️' : percent >= 75 ? 'Отлично! Мошенникам будет сложно тебя обмануть! 🌟' : percent >= 50 ? 'Хорошо! Но будь внимательнее! 👀' : 'Нужно быть осторожнее! Пройди ещё раз! 🔄'}</p><div class="w-full bg-[#0B1E33] rounded-full h-4 mb-8"><div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-4 rounded-full" style="width: ${percent}%;"></div></div></div><div class="flex flex-col sm:flex-row gap-4 justify-center"><button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl font-semibold hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="restartGame()"><i data-lucide="rotate-ccw" size="20"></i>Пройти снова</button><button class="px-8 py-4 bg-white/10 backdrop-blur-sm text-white rounded-xl font-semibold border border-white/20 hover:bg-white/20 hover:border-[#00FF94]/50 transition-all hover:scale-105 flex items-center justify-center gap-2" onclick="goHome()"><i data-lucide="home" size="20"></i>На главную</button></div></div></div>`;
    }

    function updateActiveNav() {
      const navItems = document.querySelectorAll('[data-nav]');
      navItems.forEach(item => { item.classList.remove('text-white', 'bg-white/20'); item.classList.add('text-white/80', 'hover:text-white', 'hover:bg-white/5'); });
      let activeNav = null;
      if (currentScreen === 'learning') { if (currentTopic === 'phone') activeNav = 'phone'; else if (currentTopic === 'internet') activeNav = 'internet'; else if (currentTopic === 'computer') activeNav = 'computer'; }
      else if (currentScreen === 'quiz') activeNav = 'quiz';
      else if (currentScreen === 'game') activeNav = 'game';
      if (activeNav) { const activeItem = document.querySelector(`[data-nav="${activeNav}"]`); if (activeItem) activeItem.classList.add('text-white', 'bg-white/20'); }
    }

    function renderScreen() {
      const content = document.getElementById('screenContent'); let html = '';
      if (currentScreen === 'home') html = renderHome();
      else if (currentScreen === 'topicSelect') html = renderTopicSelect();
      else if (currentScreen === 'learning') html = renderLearning();
      else if (currentScreen === 'checkSelect') html = renderCheckSelect();
      else if (currentScreen === 'quiz') html = renderQuiz();
      else if (currentScreen === 'game') html = renderGame();
      content.innerHTML = html; lucide.createIcons();
      updateActiveNav();
      if (currentScreen === 'learning') { if (currentTopic === 'phone') setTimeout(() => initSwipe(), 100); }
    }

    window.navigateTo = function(screen) {
      stopSpeech();
      if (screen === 'quiz') { quizState.currentQuestion = 0; quizState.selectedAnswer = null; quizState.showExplanation = false; quizState.score = 0; currentScreen = 'quiz'; renderScreen(); }
      else if (screen === 'game') { gameState.currentMessage = 0; gameState.selectedAnswer = null; gameState.showResult = false; gameState.score = 0; currentScreen = 'game'; renderScreen(); }
      else { currentScreen = screen; renderScreen(); }
    };
    window.goHome = function() { stopSpeech(); currentScreen = 'home'; renderScreen(); };
    window.goBack = function() { stopSpeech(); if (currentScreen === 'learning') { currentScreen = 'topicSelect'; renderScreen(); } else goHome(); };
    window.startLearning = function(topic) { stopSpeech(); currentTopic = topic; learningStep = 0; currentScreen = 'learning'; renderScreen(); };
    window.nextStep = function() {
      stopSpeech(); let steps = currentTopic === 'phone' ? phoneSteps : (currentTopic === 'internet' ? internetSteps : computerSteps);
      if (learningStep < steps.length - 1) { learningStep++; if (currentTopic === 'internet') { setInternetStep(learningStep); } else renderScreen(); }
    };
    window.prevStep = function() {
      stopSpeech(); if (learningStep > 0) { learningStep--; if (currentTopic === 'internet') { setInternetStep(learningStep); } else renderScreen(); }
    };
    window.finishLearning = function() { stopSpeech(); currentScreen = 'topicSelect'; renderScreen(); };
    window.selectQuizAnswer = function(idx) { if (quizState.selectedAnswer !== null) return; quizState.selectedAnswer = idx; quizState.showExplanation = true; if (idx === quizState.questions[quizState.currentQuestion].correct) quizState.score++; renderScreen(); };
    window.nextQuizQuestion = function() { if (quizState.currentQuestion < quizState.questions.length - 1) { quizState.currentQuestion++; quizState.selectedAnswer = null; quizState.showExplanation = false; renderScreen(); } else { quizState.currentQuestion = quizState.questions.length; renderScreen(); } };
    window.restartQuiz = function() { stopSpeech(); quizState.currentQuestion = 0; quizState.selectedAnswer = null; quizState.showExplanation = false; quizState.score = 0; renderScreen(); };
    window.selectGameAnswer = function(isScam) { if (gameState.selectedAnswer !== null) return; gameState.selectedAnswer = isScam; gameState.showResult = true; if (isScam === gameState.messages[gameState.currentMessage].isScam) gameState.score++; renderScreen(); };
    window.nextGameMessage = function() { if (gameState.currentMessage < gameState.messages.length - 1) { gameState.currentMessage++; gameState.selectedAnswer = null; gameState.showResult = false; renderScreen(); } else { gameState.currentMessage = gameState.messages.length; renderScreen(); } };
    window.restartGame = function() { stopSpeech(); gameState.currentMessage = 0; gameState.selectedAnswer = null; gameState.showResult = false; gameState.score = 0; renderScreen(); };

    document.getElementById('mobileMenuBtn').addEventListener('click', () => { document.getElementById('mobileNav').classList.toggle('hidden'); });
    document.getElementById('logo').addEventListener('click', goHome);
    loadData();
  </script>
</body>
</html>
