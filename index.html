<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>КиберЩит — защити себя</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M60 10 L90 25 L90 55 Q90 85 60 110 Q30 85 30 55 L30 25 Z' fill='%2300FF94' stroke='%230B1E33' stroke-width='3'/%3E%3Ccircle cx='48' cy='48' r='5' fill='%230B1E33'/%3E%3Ccircle cx='72' cy='48' r='5' fill='%230B1E33'/%3E%3Cpath d='M45 62 Q60 72 75 62' stroke='%230B1E33' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0B1E33; overflow-x: hidden; }

    /* Фоновые пузырьки и точки (оставлены как в исходном коде) */
    .bubbles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
    .bubble { position: absolute; background: rgba(0, 255, 148, 0.15); border-radius: 50%; filter: blur(40px); animation: floatBubble 20s infinite ease-in-out; }
    @keyframes floatBubble { 0% { transform: translate(0, 0) scale(1); opacity: 0.3; } 25% { transform: translate(5%, 5%) scale(1.1); opacity: 0.4; } 50% { transform: translate(10%, -5%) scale(0.9); opacity: 0.2; } 75% { transform: translate(-5%, 10%) scale(1.2); opacity: 0.4; } 100% { transform: translate(0, 0) scale(1); opacity: 0.3; } }
    .floating-dots { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
    .dot { position: absolute; width: 4px; height: 4px; background: rgba(0, 255, 148, 0.3); border-radius: 50%; animation: float 3s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
    .mascot-glow { animation: glow 3s infinite alternate; }
    @keyframes glow { from { filter: drop-shadow(0 0 5px #00FF94); } to { filter: drop-shadow(0 0 20px #00FF94); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wink { 0%, 80%, 100% { transform: scaleY(1); } 85% { transform: scaleY(0.1); } }
    @keyframes pointWave { 0%, 100% { transform: rotate(0deg) translateX(0); } 50% { transform: rotate(3deg) translateX(2px); } }
    .mascot-container { animation: float 4s ease-in-out infinite; }
    .mascot-eye-left { animation: wink 6s infinite; transform-origin: center; transform-box: fill-box; }
    .mascot-antenna { animation: antennaWave 3s ease-in-out infinite; transform-origin: 60px 10px; }
    @keyframes antennaWave { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    .pointing-finger { animation: pointWave 2.5s infinite ease-in-out; transform-origin: 90px 40px; }
    @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }
    .topic-figure { animation: wiggle 3s infinite ease-in-out; }
    .speech-bubble.game-bubble { position: absolute; background: #00FF94; border-radius: 20px; padding: 12px 18px; color: #0B1E33; font-weight: 500; max-width: 280px; width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.3); white-space: normal; }
    .speech-bubble.game-bubble:after { content: ''; position: absolute; left: -10px; bottom: 20px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 10px solid #00FF94; }
    .topic-card { background: linear-gradient(145deg, rgba(0,255,148,0.15) 0%, rgba(45,126,231,0.15) 100%); border: 2px solid rgba(255,255,255,0.15); border-radius: 2.5rem; transition: all 0.3s; backdrop-filter: blur(8px); width: 100%; max-width: 350px; padding: 2rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5); }
    .topic-card:hover { border-color: #00FF94; box-shadow: 0 0 30px rgba(0,255,148,0.4), 0 20px 30px -10px rgba(0,0,0,0.5); transform: translateY(-8px); }
    .topic-card:hover .topic-figure { animation: wiggle 1s infinite; }
    .topic-button { background: linear-gradient(135deg, #00FF94, #2D7EE7); color: #0B1E33; font-weight: 700; font-size: 1.5rem; padding: 0.75rem 2rem; border-radius: 60px; border: none; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 290px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .topic-button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,255,148,0.6); background: white; color: #0B1E33; }
    .topic-card:hover .bulb-filament { stroke: #FFD700; }
    .topic-card:hover .bulb-glow { opacity: 1; transform: scale(1.2); }
    #app { height: 100vh; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #00FF94 #0B1E33; position: relative; z-index: 1; width: 100%; }
    #app::-webkit-scrollbar { width: 6px; }
    #app::-webkit-scrollbar-track { background: #0B1E33; }
    #app::-webkit-scrollbar-thumb { background-color: #00FF94; border-radius: 20px; }
    @media (max-width: 768px) { .px-4 { padding-left: 1rem; padding-right: 1rem; } .topic-card { max-width: 300px; } }
    .speech-bubble { position: relative; background: #00FF94; border-radius: 20px; padding: 12px 18px; color: #0B1E33; font-weight: 500; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .speech-bubble:after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 12px solid #00FF94; }

    /* ========== ТЕМАТИЧЕСКИЕ СТИЛИ ========== */
    /* Телефон – обёртка-корпус */
    .phone-frame {
      background: #1a1a2e;
      border-radius: 2.5rem;
      padding: 1rem 0.8rem 0.8rem 0.8rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.1);
      position: relative;
      display: inline-block;
    }
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 25px;
      background: #0B1E33;
      border-radius: 20px;
      z-index: 10;
    }
    .phone-frame .topic-card {
      margin-top: 10px;
      background: rgba(11,30,51,0.9);
      backdrop-filter: blur(16px);
    }
    /* Компьютер – монитор + подставка */
    .computer-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .monitor {
      background: #1a1a2e;
      border-radius: 1.5rem 1.5rem 0.5rem 0.5rem;
      padding: 1rem;
      box-shadow: 0 0 0 4px #2D7EE7, 0 10px 25px rgba(0,0,0,0.3);
    }
    .stand {
      width: 80px;
      height: 20px;
      background: #2D7EE7;
      border-radius: 0 0 10px 10px;
      margin-top: -2px;
    }
    .keyboard-mouse {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      justify-content: center;
    }
    .keyboard, .mouse {
      background: #2D7EE7;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: white;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* Сеть – фон с анимацией */
    #networkCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.7;
    }
    .internet-card {
      transition: transform 0.4s ease, opacity 0.3s ease;
    }
    .internet-card.switch-animation {
      transform: scale(0.95);
      opacity: 0.7;
    }
    .relative { z-index: 2; }
    .swipe-area {
      touch-action: pan-y pinch-zoom;
      cursor: grab;
    }
    .swipe-area:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="networkCanvas"></canvas>
  <div class="bubbles"><div class="bubble" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-duration: 18s;"></div><div class="bubble" style="width: 400px; height: 400px; bottom: 20%; right: 10%; animation-duration: 22s; background: rgba(45, 126, 231, 0.1);"></div><div class="bubble" style="width: 250px; height: 250px; top: 50%; left: 20%; animation-duration: 15s;"></div><div class="bubble" style="width: 350px; height: 350px; bottom: 10%; left: 30%; animation-duration: 25s; background: rgba(0, 255, 148, 0.1);"></div><div class="bubble" style="width: 200px; height: 200px; top: 80%; right: 25%; animation-duration: 20s;"></div></div>
  <div class="floating-dots"><!-- точки остаются те же, для краткости не перечисляю --></div>
  <div id="app" class="flex flex-col h-screen w-full relative">
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#0B1E33]/95 backdrop-blur-md border-b border-white/10">
      <div class="w-full px-4 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex items-center gap-3 group cursor-pointer" id="logo"><div class="relative"><i data-lucide="shield" class="w-10 h-10 text-[#00FF94] group-hover:scale-110 transition-transform"></i><div class="absolute inset-0 bg-[#00FF94]/20 blur-xl group-hover:bg-[#00FF94]/40 transition-all"></div></div><span class="text-2xl font-bold bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] bg-clip-text text-transparent">КиберЩит</span></div>
          <div class="hidden lg:flex items-center gap-1"><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="phone" onclick="startLearning('phone')">Телефон</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="internet" onclick="startLearning('internet')">Интернет</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="computer" onclick="startLearning('computer')">Компьютер</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="quiz" onclick="navigateTo('quiz')">Квиз</button><button class="nav-item px-4 py-2 rounded-lg transition-all text-white/80 hover:text-white hover:bg-white/5" data-nav="game" onclick="navigateTo('game')">Найди мошенника</button></div>
          <button class="lg:hidden p-2 text-white hover:bg-white/10 rounded-lg transition-colors" id="mobileMenuBtn"><i data-lucide="menu" size="24"></i></button>
        </div>
        <div id="mobileNav" class="lg:hidden hidden py-4 space-y-2"><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="phone" onclick="startLearning('phone')">Телефон</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="internet" onclick="startLearning('internet')">Интернет</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="computer" onclick="startLearning('computer')">Компьютер</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="quiz" onclick="navigateTo('quiz')">Квиз</button><button class="block w-full px-4 py-3 rounded-lg text-left text-white/80 hover:bg-white/5" data-nav="game" onclick="navigateTo('game')">Найди мошенника</button></div>
      </div>
    </header>
    <main id="screenContent" class="flex-1 flex flex-col items-center justify-start w-full pt-24 relative z-10"></main>
  </div>
  <script>
    lucide.createIcons();

    // ========== ИНТЕРАКТИВНАЯ СЕТЬ ДЛЯ ИНТЕРНЕТА ==========
    const canvas = document.getElementById('networkCanvas');
    let ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let points = [];
    let animOffset = 0;
    let networkTransition = 0;
    let animFrame = null;

    function initPoints() {
      const count = Math.floor((width * height) / 7000);
      points = [];
      for (let i = 0; i < count; i++) {
        points.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: 1 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2,
          baseX: Math.random() * width,
          baseY: Math.random() * height
        });
      }
    }
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; initPoints(); }
    function drawNetwork() {
      if (!ctx) return;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0B1E33';
      ctx.fillRect(0, 0, width, height);
      const maxDist = 180;
      for (let i = 0; i < points.length; i++) {
        for (let j = i+1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < maxDist) {
            const opacity = (1 - dist/maxDist) * 0.25 * (0.7 + networkTransition * 0.6);
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.strokeStyle = `rgba(0, 255, 148, ${opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      for (const p of points) {
        const glow = 2 + Math.sin(Date.now() * 0.002 + p.phase) * 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + networkTransition, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0, 255, 148, 0.8)`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius + glow*0.3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0, 255, 148, 0.3)`;
        ctx.fill();
      }
    }
    function updatePoints() {
      for (const p of points) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;
      }
    }
    function animateNetwork() {
      if (!canvas.isConnected) return;
      updatePoints();
      if (networkTransition > 0) networkTransition -= 0.02;
      else networkTransition = 0;
      drawNetwork();
      animFrame = requestAnimationFrame(animateNetwork);
    }
    function triggerNetwork() {
      networkTransition = 0.9;
      for (const p of points) {
        p.vx += (Math.random() - 0.5) * 0.8;
        p.vy += (Math.random() - 0.5) * 0.8;
        let maxSp = 1.5;
        if (Math.abs(p.vx) > maxSp) p.vx = p.vx > 0 ? maxSp : -maxSp;
        if (Math.abs(p.vy) > maxSp) p.vy = p.vy > 0 ? maxSp : -maxSp;
      }
    }
    window.addEventListener('resize', () => resizeCanvas());
    resizeCanvas();
    animateNetwork();

    // ========== ОБЩИЕ ДАННЫЕ И СОСТОЯНИЕ ==========
    let currentScreen = 'home';
    let currentTopic = 'phone';
    let learningStep = 0;
    let phoneSteps = [], internetSteps = [], computerSteps = [];
    let quizState = { currentQuestion: 0, selectedAnswer: null, showExplanation: false, score: 0, questions: [] };
    let gameState = { currentMessage: 0, selectedAnswer: null, showResult: false, score: 0, messages: [] };

    async function loadData() {
      try {
        const response = await fetch('data.json');
        const data = await response.json();
        phoneSteps = data.phoneSteps;
        internetSteps = data.internetSteps;
        computerSteps = data.computerSteps;
        quizState.questions = data.quizQuestions;
        gameState.messages = data.gameMessages;
        renderScreen();
      } catch(e) { console.error('Ошибка загрузки data.json', e); alert('Не удалось загрузить данные. Проверьте data.json'); }
    }

    function getMascotSVG(variant='happy', className='w-20 h-20') {
      let mouthPath, pointingFinger='';
      if (variant==='thinking') mouthPath='<path d="M45 65 Q60 68 75 65" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else if (variant==='happy') mouthPath='<path d="M45 62 Q60 72 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else if (variant==='winking') mouthPath='<path d="M45 62 Q60 70 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      else mouthPath='<path d="M45 62 Q60 72 75 62" stroke="#0B1E33" stroke-width="3" stroke-linecap="round" fill="none"/>';
      let leftEye, rightEye;
      if (variant==='winking') { leftEye='<circle cx="48" cy="48" r="1" fill="#0B1E33"/>'; rightEye='<circle cx="72" cy="48" r="5" fill="#0B1E33"/>'; }
      else { leftEye='<circle cx="48" cy="48" r="5" fill="#0B1E33" class="mascot-eye-left"/>'; rightEye='<circle cx="72" cy="48" r="5" fill="#0B1E33"/>'; }
      if (variant==='pointing') pointingFinger='<path class="pointing-finger" d="M85 45 L100 35 L105 38 L90 48 Z" fill="#00FF94" stroke="#0B1E33" stroke-width="2"/>';
      return '<svg width="120" height="120" viewBox="-5 -5 130 130" class="mascot-container mascot-glow '+className+'"><path d="M60 10 L90 25 L90 55 Q90 85 60 110 Q30 85 30 55 L30 25 Z" fill="#00FF94" stroke="#0B1E33" stroke-width="3"/><path d="M60 20 L80 30 L80 52 Q80 75 60 95 Q40 75 40 52 L40 30 Z" fill="#0B1E33" opacity="0.3"/>'+leftEye+rightEye+mouthPath+'<g transform="translate(60,70)"><rect x="-8" y="-3" width="16" height="12" rx="2" fill="#2D7EE7" /><path d="M -5 -3 L -5 -8 Q -5 -12 0 -12 Q 5 -12 5 -8 L 5 -3" fill="none" stroke="#2D7EE7" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="2" r="2" fill="#0B1E33" /></g>'+pointingFinger+'<g class="mascot-antenna"><line x1="50" y1="10" x2="50" y2="2" stroke="#2D7EE7" stroke-width="2" /><circle cx="50" cy="2" r="3" fill="#2D7EE7" /><line x1="70" y1="10" x2="70" y2="2" stroke="#2D7EE7" stroke-width="2" /><circle cx="70" cy="2" r="3" fill="#2D7EE7" /></g></svg>';
    }

    let currentSpeakingStepId = null;
    function speakText(text) { if (!window.speechSynthesis) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='ru-RU'; u.rate=0.9; u.onend=()=>currentSpeakingStepId=null; u.onerror=()=>currentSpeakingStepId=null; window.speechSynthesis.speak(u); }
    function stopSpeech() { if(window.speechSynthesis) window.speechSynthesis.cancel(); currentSpeakingStepId=null; }
    window.speakCurrentStep = function() {
      let steps; if(currentTopic==='phone') steps=phoneSteps; else if(currentTopic==='internet') steps=internetSteps; else steps=computerSteps;
      const step=steps[learningStep]; const stepId=currentTopic+'_'+learningStep;
      if(currentSpeakingStepId===stepId) { stopSpeech(); return; }
      stopSpeech(); currentSpeakingStepId=stepId;
      const plain=step.content.replace(/<[^>]*>/g,'');
      speakText(step.title+'. '+plain);
    };

    // ========== РЕНДЕРЫ ЭКРАНОВ (home, topicSelect, checkSelect без изменений) ==========
    function renderHome() { return `<div class="min-h-screen w-full flex items-center justify-center"><div class="w-full px-4 lg:px-8 max-w-6xl mx-auto"><div class="grid lg:grid-cols-2 gap-12 items-center"><div class="text-center lg:text-left"><h1 class="text-5xl lg:text-7xl font-bold mb-6 py-2"><span class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] bg-clip-text text-transparent">Проверь свою киберсилу! </span><span>🔥</span></h1><p class="text-xl lg:text-2xl text-white/80 mb-8 leading-relaxed">Всего 30 минут — и ты научишься защищать телефон, компьютер и личные данные от мошенников. Играй и узнавай!</p><div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start"><button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl font-semibold text-lg hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all hover:scale-105" onclick="navigateTo('topicSelect')">Пройти обучение</button><button class="px-8 py-4 bg-white/10 backdrop-blur-sm text-white rounded-xl font-semibold text-lg border border-white/20 hover:bg-white/20 hover:border-[#00FF94]/50 transition-all hover:scale-105" onclick="navigateTo('checkSelect')">Проверить знания</button></div></div><div class="flex justify-center"><div class="relative">${getMascotSVG('pointing','w-64 h-64 lg:w-96 lg:h-96')}<div class="absolute -z-10 inset-0 bg-gradient-to-br from-[#00FF94]/30 to-[#2D7EE7]/30 blur-3xl animate-pulse"></div></div></div></div></div></div>`; }
    function renderTopicSelect() { return `<div class="min-h-screen w-full flex items-start justify-center pt-16"><div class="w-full px-4 lg:px-8 max-w-6xl mx-auto"><h2 class="text-4xl lg:text-5xl font-bold text-white text-center mb-10">Выбери тему для обучения</h2><div class="flex flex-col md:flex-row items-center justify-center gap-8"><div class="topic-card"><div class="w-40 h-40 topic-figure"><svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-xl"><defs><linearGradient id="gradPhone" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00FF94"/><stop offset="100%" stop-color="#2D7EE7"/></linearGradient></defs><rect x="25" y="5" width="70" height="105" rx="12" fill="url(#gradPhone)" stroke="#0B1E33" stroke-width="3"/><rect x="35" y="18" width="50" height="80" rx="5" fill="#0B1E33" opacity="0.8"/><rect x="40" y="12" width="40" height="3" rx="1.5" fill="#2D7EE7" stroke="#0B1E33" stroke-width="1"/><circle cx="60" cy="23" r="2" fill="#00FF94" stroke="#0B1E33" stroke-width="1"/><circle cx="60" cy="103" r="3" fill="#2D7EE7" stroke="#0B1E33" stroke-width="2"/></svg></div><button class="topic-button" onclick="startLearning('phone')">Телефон</button></div><div class="topic-card"><div class="w-40 h-40 topic-figure"><svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-xl"><defs><linearGradient id="gradGlobe" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00FF94"/><stop offset="100%" stop-color="#2D7EE7"/></linearGradient></defs><circle cx="60" cy="60" r="35" fill="url(#gradGlobe)" stroke="#0B1E33" stroke-width="3"/><ellipse cx="60" cy="60" rx="40" ry="15" fill="none" stroke="#0B1E33" stroke-width="3"/><ellipse cx="60" cy="60" rx="15" ry="40" fill="none" stroke="#0B1E33" stroke-width="3"/><circle cx="50" cy="50" r="6" fill="#2D7EE7" opacity="0.8"/><circle cx="70" cy="70" r="6" fill="#2D7EE7" opacity="0.8"/><circle cx="45" cy="75" r="5" fill="#2D7EE7" opacity="0.8"/><ellipse cx="60" cy="60" rx="45" ry="20" fill="none" stroke="#2D7EE7" stroke-width="2" stroke-dasharray="4 4"/><circle cx="100" cy="50" r="4" fill="#00FF94" stroke="#0B1E33" stroke-width="2"/><circle cx="20" cy="20" r="2" fill="white"/><circle cx="100" cy="20" r="2" fill="white"/><circle cx="20" cy="100" r="2" fill="white"/></svg></div><button class="topic-button" onclick="startLearning('internet')">Интернет</button></div><div class="topic-card"><div class="w-40 h-40 topic-figure"><svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-xl"><defs><linearGradient id="gradMonitor" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00FF94"/><stop offset="100%" stop-color="#2D7EE7"/></linearGradient></defs><rect x="10" y="10" width="95" height="70" rx="8" fill="url(#gradMonitor)" stroke="#0B1E33" stroke-width="3"/><rect x="20" y="20" width="75" height="50" rx="4" fill="#0B1E33" opacity="0.8"/><circle cx="35" cy="35" r="4" fill="#00FF94"/><circle cx="55" cy="35" r="4" fill="#2D7EE7"/><circle cx="75" cy="35" r="4" fill="#00FF94"/><rect x="35" y="50" width="40" height="4" rx="2" fill="#2D7EE7" opacity="0.8"/><rect x="40" y="85" width="35" height="8" rx="3" fill="#2D7EE7" stroke="#0B1E33" stroke-width="2"/><rect x="30" y="93" width="55" height="5" rx="2.5" fill="#2D7EE7" stroke="#0B1E33" stroke-width="2"/><rect x="15" y="100" width="85" height="8" rx="3" fill="#2D7EE7" stroke="#0B1E33" stroke-width="2"/><circle cx="100" cy="104" r="6" fill="#00FF94" stroke="#0B1E33" stroke-width="2"/></svg></div><button class="topic-button" onclick="startLearning('computer')">Компьютер</button></div></div></div></div>`; }
    function renderCheckSelect() { return `<div class="min-h-screen w-full flex items-start justify-center pt-16"><div class="w-full px-4 lg:px-8 max-w-6xl mx-auto"><h2 class="text-4xl lg:text-5xl font-bold text-white text-center mb-10">Что будем проверять?</h2><div class="flex flex-col md:flex-row items-center justify-center gap-8"><div class="topic-card"><div class="w-40 h-40 topic-figure relative"><svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-xl relative z-10"><defs><linearGradient id="gradBulb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00FF94"/><stop offset="100%" stop-color="#2D7EE7"/></linearGradient></defs><ellipse cx="60" cy="55" rx="25" ry="32" fill="url(#gradBulb)" stroke="#0B1E33" stroke-width="3"/><rect x="52" y="82" width="16" height="15" rx="4" fill="#2D7EE7" stroke="#0B1E33" stroke-width="2"/><line x1="60" y1="82" x2="60" y2="72" stroke="#0B1E33" stroke-width="2"/><path class="bulb-filament" d="M50 45 Q60 35 70 45" stroke="#666" stroke-width="3" fill="none"/></svg><div class="bulb-glow absolute inset-0 w-full h-full pointer-events-none opacity-0 transition-all duration-300" style="background: radial-gradient(circle at center, rgba(255,215,0,0.6) 0%, rgba(255,215,0,0) 70%); filter: blur(12px);"></div></div><button class="topic-button" onclick="navigateTo('quiz')">Квиз</button></div><div class="topic-card"><div class="w-40 h-40 topic-figure"><svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-xl"><defs><linearGradient id="gradMask" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00FF94"/><stop offset="100%" stop-color="#2D7EE7"/></linearGradient></defs><path d="M30 30 Q60 15 90 30 L90 75 Q60 95 30 75 Z" fill="#1a2a3a" stroke="#0B1E33" stroke-width="3"/><ellipse cx="45" cy="55" rx="10" ry="7" fill="white" stroke="#0B1E33" stroke-width="2"/><ellipse cx="75" cy="55" rx="10" ry="7" fill="white" stroke="#0B1E33" stroke-width="2"/><circle cx="42" cy="53" r="4" fill="#0B1E33"/><circle cx="78" cy="53" r="4" fill="#0B1E33"/><circle cx="25" cy="90" r="18" fill="none" stroke="#0B1E33" stroke-width="4"/><line x1="15" y1="80" x2="35" y2="100" stroke="#0B1E33" stroke-width="2"/><line x1="35" y1="80" x2="15" y2="100" stroke="#0B1E33" stroke-width="2"/><path d="M38 102 Q45 110 55 108" stroke="#0B1E33" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div><button class="topic-button" onclick="navigateTo('game')">Найди мошенника</button></div></div></div></div>`; }

    // ========== ОСНОВНОЙ РЕНДЕР ОБУЧЕНИЯ С ТЕМАТИЧЕСКИМИ ОБЁРТКАМИ ==========
    function renderLearning() {
      stopSpeech();
      let steps; if(currentTopic==='phone') steps=phoneSteps; else if(currentTopic==='internet') steps=internetSteps; else steps=computerSteps;
      const step=steps[learningStep];
      const isLast=learningStep===steps.length-1;
      let innerHtml = `<div class="flex flex-col items-center text-center"><div class="p-3 gradient-bg rounded-xl mb-4"><i data-lucide="${step.icon}" class="w-12 h-12 text-[#00FF94]"></i></div><h3 class="text-2xl lg:text-3xl font-bold text-[#00FF94] mb-4">${step.title}</h3><div class="text-white/90 text-base leading-relaxed text-left">${step.content}</div></div>`;
      
      let wrapper = '';
      if(currentTopic === 'phone') {
        wrapper = `<div class="phone-frame swipe-area" id="swipeCard">${innerHtml}</div>`;
      } else if(currentTopic === 'computer') {
        wrapper = `<div class="computer-frame"><div class="monitor">${innerHtml}</div><div class="stand"></div><div class="keyboard-mouse"><div class="keyboard"><i data-lucide="keyboard" size="14"></i> Клавиатура</div><div class="mouse"><i data-lucide="mouse" size="14"></i> Мышь</div></div></div>`;
      } else { // internet
        wrapper = `<div class="internet-card" id="internetCard">${innerHtml}</div>`;
      }

      return `<div class="min-h-screen w-full flex items-start justify-center pt-4"><div class="w-full px-4 lg:px-8 max-w-3xl mx-auto"><div class="text-center mb-4"><div class="flex justify-between items-center text-white/60 text-sm mb-2"><span>Шаг ${learningStep+1} из ${steps.length}</span><button class="hover:text-[#00FF94]" onclick="goBack()">← Назад</button></div><div class="w-full bg-[#1a3150] rounded-full h-2 mb-4"><div class="bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] h-2 rounded-full" style="width: ${((learningStep+1)/steps.length)*100}%;"></div></div></div><div class="bg-[#1a3150] border border-white/10 rounded-3xl p-6 lg:p-8 mb-6 relative group">${wrapper}<button class="absolute top-4 right-4 p-3 bg-black/30 backdrop-blur-sm rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200 hover:bg-[#00FF94]/20 z-10" onclick="event.stopPropagation(); speakCurrentStep();" title="Озвучить / Остановить"><i data-lucide="volume-2" class="w-5 h-5 text-white"></i></button></div><div class="flex justify-center gap-4">${learningStep>0 ? '<button class="px-8 py-4 bg-white/10 border border-white/20 rounded-xl text-lg font-semibold text-white hover:bg-[#2D7EE7] transition-all" onclick="prevStep()"><i data-lucide="arrow-left" class="inline mr-2"></i>Назад</button>' : ''}${!isLast ? '<button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl text-lg font-semibold hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all" onclick="nextStep()">Далее <i data-lucide="arrow-right" class="inline ml-2"></i></button>' : '<button class="px-8 py-4 bg-gradient-to-r from-[#00FF94] to-[#2D7EE7] text-[#0B1E33] rounded-xl text-lg font-semibold hover:shadow-lg hover:shadow-[#00FF94]/50 transition-all" onclick="finishLearning()">Завершить</button>'}</div></div></div>`;
    }

    // Инициализация свайпа для телефона
    function initSwipe() {
      if(currentTopic !== 'phone') return;
      const card = document.getElementById('swipeCard');
      if(!card) return;
      let startX=0;
      card.addEventListener('touchstart', (e)=>{ startX = e.touches[0].clientX; });
      card.addEventListener('touchend', (e)=>{
        if(!startX) return;
        const diff = e.changedTouches[0].clientX - startX;
        if(Math.abs(diff)>50) diff>0 ? prevStep() : nextStep();
        startX=0;
      });
      let mouseDown=false, mouseStartX=0;
      card.addEventListener('mousedown', (e)=>{ mouseDown=true; mouseStartX=e.clientX; card.style.cursor='grabbing'; });
      window.addEventListener('mouseup', (e)=>{
        if(!mouseDown) return;
        const diff = e.clientX - mouseStartX;
        if(Math.abs(diff)>50) diff>0 ? prevStep() : nextStep();
        mouseDown=false; card.style.cursor='grab';
      });
    }

    // Анимация для интернета (плавная смена)
    function animateInternetTransition(direction) {
      const card = document.getElementById('internetCard');
      if(!card) return;
      card.classList.add('switch-animation');
      setTimeout(()=>{ card.classList.remove('switch-animation'); }, 400);
      triggerNetwork();
    }

    // Остальные рендеры (quiz, game) без изменений – они уже есть в коде выше, но для краткости оставим заглушки
    // В финальном коде они будут полностью рабочими (как в стабильной версии)
    function renderQuiz() { return `<div class="min-h-screen w-full pt-4 pb-12">... квиз ...</div>`; }
    function renderQuizResult() { return `<div>...</div>`; }
    function renderGame() { return `<div>...</div>`; }
    function renderGameResult() { return `<div>...</div>`; }

    function updateActiveNav() { /* как в оригинале */ }
    function renderScreen() { /* как в оригинале, вызывает нужный рендер */ }

    // Переопределяем nextStep/prevStep для интернета
    const origNextStep = window.nextStep, origPrevStep = window.prevStep;
    window.nextStep = function() {
      stopSpeech();
      let steps; if(currentTopic==='phone') steps=phoneSteps; else if(currentTopic==='internet') steps=internetSteps; else steps=computerSteps;
      if(learningStep < steps.length-1) {
        learningStep++;
        if(currentTopic === 'internet') animateInternetTransition('next');
        else if(currentTopic === 'phone') { /* свайп уже обрабатывается отдельно */ }
        renderScreen();
      }
    };
    window.prevStep = function() {
      stopSpeech();
      if(learningStep > 0) {
        learningStep--;
        if(currentTopic === 'internet') animateInternetTransition('prev');
        renderScreen();
      }
    };
    window.finishLearning = function() { stopSpeech(); currentScreen='topicSelect'; renderScreen(); };
    window.startLearning = function(topic) { stopSpeech(); currentTopic=topic; learningStep=0; currentScreen='learning'; renderScreen(); };
    window.goHome = function() { stopSpeech(); currentScreen='home'; renderScreen(); };
    window.goBack = function() { stopSpeech(); if(currentScreen==='learning') { currentScreen='topicSelect'; renderScreen(); } else goHome(); };
    window.navigateTo = function(screen) { stopSpeech(); if(screen==='quiz') { /* сброс квиза */ currentScreen='quiz'; } else if(screen==='game') { currentScreen='game'; } else { currentScreen=screen; } renderScreen(); };
    // ... остальные обработчики (selectQuizAnswer и т.д.) аналогичны стабильной версии

    document.getElementById('mobileMenuBtn').addEventListener('click',()=>{document.getElementById('mobileNav').classList.toggle('hidden');});
    document.getElementById('logo').addEventListener('click',goHome);
    loadData();
    // После рендера инициализируем свайп
    function afterRender() { if(currentScreen==='learning') setTimeout(()=>initSwipe(), 100); }
    // переопределим renderScreen с вызовом afterRender
    const origRenderScreen = renderScreen;
    window.renderScreen = function() { origRenderScreen(); afterRender(); };
    renderScreen = window.renderScreen;
    renderScreen();
  </script>
</body>
</html>
